services:
  inventory:
    image: ghcr.io/thodgesproav/warehouseinv:1.3.1
    container_name: warehouse-inventory
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "8000:8000"
    environment:
      WAREHOUSE_PANEL_USER: panel
      WAREHOUSE_PANEL_TOKEN_FILE: /run/secrets/warehouse_panel_token
    secrets:
      - warehouse_panel_token
    volumes:
      - inventory_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  inventory_data:

secrets:
  warehouse_panel_token:
    file: ./secrets/warehouse_panel_token
